name: Supabase keep-alive
on:
  schedule:
    # Every 2 days at 01:17 UTC
    - cron: '17 1 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Real DB read via Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -m 90 -o body.json -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/entries?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo 000)
            bytes=$(wc -c < body.json 2>/dev/null || echo 0)
            echo "Attempt $i: HTTP $code, body $bytes bytes"
            if [ "$code" = "200" ] && grep -q '"id"' body.json; then
              echo "Keep-alive OK (row returned)"
              exit 0
            fi
            if [ "$code" = "200" ]; then echo "HTTP 200 but no rows returned (RLS / empty) - not counting as success"; fi
            sleep 30
          done
          echo "Keep-alive FAILED: no real data read"
          exit 1
