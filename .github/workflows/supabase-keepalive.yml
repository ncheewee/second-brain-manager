name: Supabase keep-alive
on:
  schedule:
    # Every 2 days at 01:17 UTC
    - cron: '17 1 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Real DB read via Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Prefer the service role key (bypasses RLS so a real row comes back).
          # Falls back to the anon key, which RLS blocks (returns []).
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -m 90 -o body.json -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/entries?select=id&limit=1" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" || echo 000)
            bytes=$(wc -c < body.json 2>/dev/null || echo 0)
            echo "Attempt $i: HTTP $code, body $bytes bytes"
            if [ "$code" = "200" ]; then
              if grep -q '"id"' body.json; then
                echo "Keep-alive OK (row returned)"
              else
                echo "Keep-alive OK (HTTP 200; query reached the database, rows hidden by RLS for this key)"
              fi
              exit 0
            fi
            sleep 30
          done
          echo "Keep-alive FAILED: database did not answer with HTTP 200"
          exit 1
